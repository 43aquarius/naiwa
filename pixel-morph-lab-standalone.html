<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>像素变换实验室 · Pixel Morph Lab</title>
<meta name="description" content="一个简单的图片像素变换工具，默认演示 smile_01 → smile_06 的转换，也支持自定义图片上传。" />
<style>
/* ============================================================
   像素变换实验室 — 单文件 HTML 简化版
   自包含：所有 CSS / JS / 两张默认图（base64）全部内联
   ============================================================ */

:root {
  --pml-accent: #d97757;
  --pml-accent-fg: #ffffff;
  --pml-muted: #f3efe9;
  --pml-card: #ffffff;
  --pml-border: #e7e2d8;
  --pml-prose: #1f1b16;
  --pml-prose-muted: #6b6358;
  --pml-bg: #faf9f6;
  --pml-shadow: rgba(0,0,0,0.08);
  color-scheme: light;
}
html[data-theme="dark"] {
  --pml-accent: #f59e0b;
  --pml-accent-fg: #1a1408;
  --pml-muted: #1f1d1a;
  --pml-card: #181715;
  --pml-border: #2a2723;
  --pml-prose: #f3efe9;
  --pml-prose-muted: #9b9489;
  --pml-bg: #141311;
  --pml-shadow: rgba(0,0,0,0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--pml-bg); color: var(--pml-prose); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; }

.container { max-width: 1000px; margin: 0 auto; padding: 0 16px; width: 100%; }
@media (min-width: 768px) { .container { padding: 0 24px; } }

/* --- Header --- */
.site-header {
  border-bottom: 1px solid var(--pml-border);
  background: var(--pml-card);
}
.site-header .inner {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--pml-accent), #6366f1);
  color: white;
  font-weight: 700;
  font-size: 11px;
}
.logo-text { font-size: 16px; font-weight: 600; }
.logo-sub { font-size: 12px; color: var(--pml-prose-muted); font-family: ui-monospace, Menlo, monospace; margin-left: 4px; }
.header-aside { margin-left: auto; font-size: 12px; color: var(--pml-prose-muted); }
.theme-btn {
  height: 32px;
  width: 32px;
  border-radius: 6px;
  border: 1px solid var(--pml-border);
  background: var(--pml-card);
  color: var(--pml-prose);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
}
.theme-btn:hover { background: var(--pml-muted); }

.icon-svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Main --- */
main { flex: 1; padding: 24px 0; }
@media (min-width: 768px) { main { padding: 40px 0; } }

/* --- 卡片 --- */
.pml-card {
  background: var(--pml-card);
  border: 1px solid var(--pml-border);
  border-radius: 12px;
}
.pml-card-pad { padding: 16px; }
@media (min-width: 768px) { .pml-card-pad { padding: 24px; } }

/* --- 主体两列布局 --- */
.demo-row { display: flex; flex-direction: column; gap: 24px; }
@media (min-width: 1024px) { .demo-row { flex-direction: row; } }
.canvas-area { flex: 1; min-width: 0; }
.canvas-box {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: repeating-conic-gradient(#e7e2d8 0% 25%, #f3efe9 0% 50%) 50% / 16px 16px;
}
html[data-theme="dark"] .canvas-box {
  background: repeating-conic-gradient(#2a2723 0% 25%, #181715 0% 50%) 50% / 16px 16px;
}
.canvas-box canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.badge-running {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(0,0,0,0.7);
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.demo-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.auto-run-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--pml-prose-muted); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid transparent;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
}
.btn-primary { background: var(--pml-accent); color: var(--pml-accent-fg); }
.btn-primary:hover { opacity: 0.9; }
.btn-outline { background: transparent; color: var(--pml-prose); border-color: var(--pml-border); }
.btn-outline:hover { background: var(--pml-muted); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.error-box {
  margin-top: 12px;
  font-size: 12px;
  color: #dc2626;
  background: color-mix(in srgb, #ef4444 8%, transparent);
  padding: 8px;
  border-radius: 4px;
}

/* --- 控件面板 --- */
.controls {
  width: 340px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: var(--pml-muted);
  border-radius: 8px;
  padding: 4px;
}
.tabs button {
  border: none;
  background: transparent;
  color: var(--pml-prose-muted);
  font-size: 13px;
  padding: 6px 4px;
  border-radius: 5px;
  cursor: pointer;
}
.tabs button.active { background: var(--pml-card); color: var(--pml-prose); box-shadow: 0 1px 2px var(--pml-shadow); }

.image-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.image-input {
  background: var(--pml-card);
  border: 1px solid var(--pml-border);
  border-radius: 8px;
  padding: 8px;
  text-align: left;
  cursor: pointer;
  color: inherit;
  width: 100%;
  transition: box-shadow 0.15s ease;
}
.image-input:hover { box-shadow: 0 4px 12px var(--pml-shadow); }
.image-input .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--pml-prose-muted); }
.image-input .thumb { aspect-ratio: 1; margin-top: 4px; border-radius: 4px; background: var(--pml-muted); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.image-input .thumb img { width: 100%; height: 100%; object-fit: contain; }
.image-input .name { margin-top: 4px; font-size: 10px; font-family: ui-monospace, Menlo, monospace; color: var(--pml-prose); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 4px; }

.help-text { font-size: 11px; color: var(--pml-prose-muted); margin-top: -8px; }

.control-group { background: var(--pml-card); border: 1px solid var(--pml-border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.control-group .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--pml-accent); }
.control-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.control-row label { font-size: 12px; color: var(--pml-prose-muted); }
.control-row select {
  height: 28px;
  padding: 0 8px;
  font-size: 12px;
  background: var(--pml-card);
  color: var(--pml-prose);
  border: 1px solid var(--pml-border);
  border-radius: 4px;
  width: 128px;
}
.slider-row .top { display: flex; justify-content: space-between; align-items: baseline; }
.slider-row .top label { font-size: 12px; color: var(--pml-prose-muted); }
.slider-row .top .val { font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: var(--pml-prose); }
.slider-row input[type=range] { width: 100%; accent-color: var(--pml-accent); }
.switch { position: relative; display: inline-block; width: 36px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--pml-border); border-radius: 999px; transition: 0.2s; }
.switch .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: 0.2s; }
.switch input:checked + .slider { background-color: var(--pml-accent); }
.switch input:checked + .slider:before { transform: translateX(16px); }

/* --- Footer --- */
.site-footer {
  margin-top: auto;
  border-top: 1px solid var(--pml-border);
  background: var(--pml-muted);
  padding: 12px 0;
  text-align: center;
  font-size: 12px;
  color: var(--pml-prose-muted);
}
</style>
</head>
<body>
<header class="site-header">
  <div class="container inner">
    <span class="logo-mark">PM</span>
    <span class="logo-text">像素变换实验室</span>
    <span class="logo-sub">Pixel Morph Lab</span>
    <span class="header-aside">默认示例：smile_01 → smile_06</span>
    <button class="theme-btn" id="theme-toggle" aria-label="切换主题" title="切换主题">
      <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="container">
    <div class="pml-card pml-card-pad">
      <div class="demo-row">
        <div class="canvas-area">
          <div class="canvas-box">
            <canvas id="pml-canvas"></canvas>
            <div class="badge-running" id="pml-running" style="display:none;">处理中</div>
          </div>
          <div class="demo-actions">
            <button class="btn btn-primary btn-sm" id="pml-run">
              <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.4 2.6"/><path d="M21 3v6h-6"/></svg>
              重新渲染
            </button>
            <button class="btn btn-outline btn-sm" id="pml-download">
              <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              下载 PNG
            </button>
            <div class="auto-run-toggle">
              <span>自动运行</span>
              <label class="switch"><input type="checkbox" id="pml-autorun" checked><span class="slider"></span></label>
            </div>
          </div>
          <div class="error-box" id="pml-error" style="display:none;"></div>
        </div>

        <div class="controls">
          <div class="tabs" id="pml-tabs">
            <button data-mode="sort">像素排序</button>
            <button data-mode="morph" class="active">形变</button>
            <button data-mode="glitch">故障</button>
            <button data-mode="pipeline">流水线</button>
          </div>

          <div class="image-inputs">
            <button class="image-input" id="pml-src-btn">
              <div class="label">源图</div>
              <div class="thumb"><img id="pml-src-thumb" alt="源图"></div>
              <div class="name" id="pml-src-name">smile_01.png</div>
            </button>
            <button class="image-input" id="pml-dst-btn">
              <div class="label">目标图</div>
              <div class="thumb"><img id="pml-dst-thumb" alt="目标图"></div>
              <div class="name" id="pml-dst-name">smile_06.png</div>
            </button>
          </div>
          <div class="help-text">默认示例为 smile_01 → smile_06，点击上方卡片可上传自定义 PNG / JPG。</div>

          <input type="file" id="pml-src-file" accept="image/*" style="display:none;">
          <input type="file" id="pml-dst-file" accept="image/*" style="display:none;">

          <div id="pml-sort-controls" class="control-group" style="display:none;">
            <div class="label">像素排序</div>
            <div class="control-row"><label>方向</label><select id="pml-sort-dir"><option value="horizontal">水平</option><option value="vertical">垂直</option></select></div>
            <div class="control-row"><label>指标</label><select id="pml-sort-metric"><option value="brightness">亮度</option><option value="hue">色相</option><option value="saturation">饱和度</option><option value="red">红</option><option value="green">绿</option><option value="blue">蓝</option></select></div>
            <div class="slider-row"><div class="top"><label>阈值</label><span class="val" id="pml-sort-th-val">128</span></div><input type="range" id="pml-sort-th" min="0" max="255" step="1" value="128"></div>
            <div class="control-row"><label>排序范围</label><select id="pml-sort-band"><option value="above">高于阈值</option><option value="below">低于阈值</option></select></div>
            <div class="slider-row"><div class="top"><label>强度</label><span class="val" id="pml-sort-int-val">80%</span></div><input type="range" id="pml-sort-int" min="0" max="100" step="1" value="80"></div>
          </div>

          <div id="pml-morph-controls" class="control-group">
            <div class="label">形变（交叉溶解）</div>
            <div class="slider-row"><div class="top"><label>强度</label><span class="val" id="pml-morph-amount-val">50%</span></div><input type="range" id="pml-morph-amount" min="0" max="100" step="1" value="50"></div>
            <div class="control-row"><label>缓动</label><select id="pml-morph-ease"><option value="linear">线性</option><option value="easeinout" selected>缓入缓出</option></select></div>
          </div>

          <div id="pml-glitch-controls" class="control-group" style="display:none;">
            <div class="label">故障（块位移）</div>
            <div class="slider-row"><div class="top"><label>强度</label><span class="val" id="pml-glitch-amount-val">50%</span></div><input type="range" id="pml-glitch-amount" min="0" max="100" step="1" value="50"></div>
            <div class="slider-row"><div class="top"><label>块数量</label><span class="val" id="pml-glitch-blocks-val">12</span></div><input type="range" id="pml-glitch-blocks" min="1" max="60" step="1" value="12"></div>
            <div class="control-row"><label>种子</label><div style="display:flex;gap:4px;align-items:center;"><input type="number" id="pml-glitch-seed" value="42" style="height:28px;width:80px;font-size:12px;background:var(--pml-card);color:var(--pml-prose);border:1px solid var(--pml-border);border-radius:4px;padding:0 8px;"><button class="btn btn-outline btn-sm" id="pml-shuffle-seed" style="height:28px;width:32px;padding:0;">⤤</button></div></div>
          </div>

          <div id="pml-pipeline-controls" class="control-group" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div>
                <div class="label">流水线顺序</div>
                <div style="font-size:11px;color:var(--pml-prose-muted);margin-top:2px;">打开则在形变前先执行像素排序</div>
              </div>
              <label class="switch"><input type="checkbox" id="pml-pipeline-sort-first" checked><span class="slider"></span></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    © 2026 像素变换实验室 · 基于 Canvas API 构建 · 单文件 HTML 版本
  </div>
</footer>

<script>
/* --- 主题切换 --- */
(function initTheme() {
  const saved = localStorage.getItem('pml-theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
document.getElementById('theme-toggle').addEventListener('click', function() {
  const cur = document.documentElement.getAttribute('data-theme');
  if (cur === 'dark') {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('pml-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('pml-theme', 'dark');
  }
});

  if (maxDim && Math.max(w, h) > maxDim) {
    const scale = maxDim / Math.max(w, h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  return { data: ctx.getImageData(0, 0, w, h).data, width: w, height: h };
}

/* --- 状态 --- */
const state = {
  mode: 'morph',
  srcImg: null, dstImg: null,
  srcBuf: null, dstBuf: null,
  srcName: 'smile_01.png', dstName: 'smile_06.png',
  srcUrl: SMILE_01_DATA_URL, dstUrl: SMILE_06_DATA_URL,
  sortDir: 'horizontal', sortMetric: 'brightness', sortThreshold: 128, sortBand: 'above', sortIntensity: 0.8,
  morphAmount: 0.5, morphEase: 'easeinout',
  glitchAmount: 0.5, glitchBlocks: 12, glitchSeed: 42,
  pipelineSortFirst: true,
  autoRun: true,
};
const MAX_DIM = 400;

document.getElementById('pml-src-thumb').src = state.srcUrl;
document.getElementById('pml-dst-thumb').src = state.dstUrl;

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('#pml-tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('pml-sort-controls').style.display = (m === 'sort' || m === 'pipeline') ? '' : 'none';
  document.getElementById('pml-morph-controls').style.display = (m === 'morph' || m === 'pipeline') ? '' : 'none';
  document.getElementById('pml-glitch-controls').style.display = (m === 'glitch' || m === 'pipeline') ? '' : 'none';
  document.getElementById('pml-pipeline-controls').style.display = m === 'pipeline' ? '' : 'none';
  render();
}

function render() {
  if (!state.srcBuf) return;
  document.getElementById('pml-running').style.display = '';
  setTimeout(() => {
    try {
      let out;
      if (state.mode === 'sort') {
        out = pixelSort(state.srcBuf, { direction: state.sortDir, metric: state.sortMetric, threshold: state.sortThreshold, thresholdMode: state.sortBand, intensity: state.sortIntensity });
      } else if (state.mode === 'morph') {
        if (!state.dstBuf) throw new Error('目标图片尚未加载');
        out = morph(state.srcBuf, state.dstBuf, { amount: state.morphAmount, easing: state.morphEase });
      } else if (state.mode === 'glitch') {
        out = glitch(state.srcBuf, { amount: state.glitchAmount, blockCount: state.glitchBlocks, seed: state.glitchSeed });
      } else {
        if (!state.dstBuf) throw new Error('目标图片尚未加载');
        const sorted = pixelSort(state.srcBuf, { direction: state.sortDir, metric: state.sortMetric, threshold: state.sortThreshold, thresholdMode: state.sortBand, intensity: state.sortIntensity });
        const baseForMorph = state.pipelineSortFirst ? sorted : state.srcBuf;
        const morphed = morph(baseForMorph, state.dstBuf, { amount: state.morphAmount, easing: state.morphEase });
        out = glitch(morphed, { amount: state.glitchAmount, blockCount: state.glitchBlocks, seed: state.glitchSeed });
      }
      const canvas = document.getElementById('pml-canvas');
      canvas.width = out.width; canvas.height = out.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.putImageData(new ImageData(out.data, out.width, out.height), 0, 0);
      document.getElementById('pml-error').style.display = 'none';
    } catch (e) {
      const errEl = document.getElementById('pml-error');
      errEl.style.display = '';
      errEl.textContent = e.message || String(e);
    } finally {
      document.getElementById('pml-running').style.display = 'none';
    }
  }, 0);
}

/* --- 加载默认图 --- */
(async function loadDefaults() {
  try {
    const [src, dst] = await Promise.all([loadImage(SMILE_01_DATA_URL), loadImage(SMILE_06_DATA_URL)]);
    state.srcImg = src; state.dstImg = dst;
    state.srcBuf = imageToBuffer(src, MAX_DIM);
    state.dstBuf = imageToBuffer(dst, MAX_DIM);
    if (state.srcBuf.width !== state.dstBuf.width || state.srcBuf.height !== state.dstBuf.height) {
      state.dstBuf = resizeBuffer(state.dstBuf, state.srcBuf.width, state.srcBuf.height);
    }
    render();
  } catch (e) {
    const errEl = document.getElementById('pml-error');
    errEl.style.display = '';
    errEl.textContent = '加载默认图片失败：' + (e.message || e);
  }
})();

/* --- 绑定事件 --- */
document.querySelectorAll('#pml-tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

document.getElementById('pml-sort-dir').addEventListener('change', e => { state.sortDir = e.target.value; if (state.autoRun) render(); });
document.getElementById('pml-sort-metric').addEventListener('change', e => { state.sortMetric = e.target.value; if (state.autoRun) render(); });
document.getElementById('pml-sort-band').addEventListener('change', e => { state.sortBand = e.target.value; if (state.autoRun) render(); });
document.getElementById('pml-sort-th').addEventListener('input', e => {
  state.sortThreshold = parseInt(e.target.value);
  document.getElementById('pml-sort-th-val').textContent = state.sortThreshold;
  if (state.autoRun) render();
});
document.getElementById('pml-sort-int').addEventListener('input', e => {
  state.sortIntensity = parseInt(e.target.value) / 100;
  document.getElementById('pml-sort-int-val').textContent = e.target.value + '%';
  if (state.autoRun) render();
});
document.getElementById('pml-morph-amount').addEventListener('input', e => {
  state.morphAmount = parseInt(e.target.value) / 100;
  document.getElementById('pml-morph-amount-val').textContent = e.target.value + '%';
  if (state.autoRun) render();
});
document.getElementById('pml-morph-ease').addEventListener('change', e => { state.morphEase = e.target.value; if (state.autoRun) render(); });
document.getElementById('pml-glitch-amount').addEventListener('input', e => {
  state.glitchAmount = parseInt(e.target.value) / 100;
  document.getElementById('pml-glitch-amount-val').textContent = e.target.value + '%';
  if (state.autoRun) render();
});
document.getElementById('pml-glitch-blocks').addEventListener('input', e => {
  state.glitchBlocks = parseInt(e.target.value);
  document.getElementById('pml-glitch-blocks-val').textContent = state.glitchBlocks;
  if (state.autoRun) render();
});
document.getElementById('pml-glitch-seed').addEventListener('input', e => { state.glitchSeed = parseInt(e.target.value) || 0; if (state.autoRun) render(); });
document.getElementById('pml-shuffle-seed').addEventListener('click', () => {
  state.glitchSeed = Math.floor(Math.random() * 99999);
  document.getElementById('pml-glitch-seed').value = state.glitchSeed;
  if (state.autoRun) render();
});
document.getElementById('pml-pipeline-sort-first').addEventListener('change', e => { state.pipelineSortFirst = e.target.checked; if (state.autoRun) render(); });
document.getElementById('pml-autorun').addEventListener('change', e => { state.autoRun = e.target.checked; });
document.getElementById('pml-run').addEventListener('click', render);
document.getElementById('pml-download').addEventListener('click', () => {
  const canvas = document.getElementById('pml-canvas');
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `像素变换-${Date.now()}.png`;
    a.click(); URL.revokeObjectURL(url);
  }, 'image/png');
});
document.getElementById('pml-src-btn').addEventListener('click', () => document.getElementById('pml-src-file').click());
document.getElementById('pml-dst-btn').addEventListener('click', () => document.getElementById('pml-dst-file').click());
document.getElementById('pml-src-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  state.srcUrl = url; state.srcName = f.name;
  document.getElementById('pml-src-thumb').src = url;
  document.getElementById('pml-src-name').textContent = f.name;
  loadImage(url).then(img => {
    state.srcImg = img;
    state.srcBuf = imageToBuffer(img, MAX_DIM);
    if (state.dstBuf) state.dstBuf = resizeBuffer(imageToBuffer(state.dstImg, MAX_DIM), state.srcBuf.width, state.srcBuf.height);
    render();
  });
});
document.getElementById('pml-dst-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  state.dstUrl = url; state.dstName = f.name;
  document.getElementById('pml-dst-thumb').src = url;
  document.getElementById('pml-dst-name').textContent = f.name;
  loadImage(url).then(img => {
    state.dstImg = img;
    const base = imageToBuffer(img, MAX_DIM);
    state.dstBuf = state.srcBuf ? resizeBuffer(base, state.srcBuf.width, state.srcBuf.height) : base;
    render();
  });
});
</script>
